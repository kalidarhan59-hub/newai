[project]
name = "manus-core-backend"
version = "0.1.0"
description = "Manus Core backend — multi-agent AI orchestrator (FastAPI)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Manus Core contributors" }]

dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "sse-starlette>=2.0",
    "chromadb>=0.4.24",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "tenacity>=8.2",
    "anyio>=4.3",
    "orjson>=3.9",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.9",
    "types-requests",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "PL", "RUF"]
# RUF012 (mutable class attrs) and PLC0415 (imports inside functions) are
# off project-wide because we deliberately use both patterns in agents and
# parsers to avoid heavy import-time work and circular dependencies.
ignore = [
    "PLR0913", "PLR2004", "PLR0911", "PLR0912", "PLR0915",
    "B008", "N818", "RUF012", "PLC0415",
    # The codebase intentionally contains Russian (Cyrillic) user-facing
    # strings in agent prompts, mock provider responses, and other UI text.
    # Ruff's RUF001/RUF002/RUF003 flag Cyrillic glyphs that look like Latin
    # letters as "ambiguous", which is noise for a Russian-language product.
    "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004", "PLR0915"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
warn_unused_ignores = true
warn_return_any = false
disallow_untyped_defs = false
plugins = []

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
